name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.x"
          python-version: "3.11"

      - name: Установка зависимостей
        run: uv sync --frozen --extra dev

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: MyPy
        run: uv run mypy src

      - name: Unit tests
        run: uv run pytest tests/unit -v

      - name: Дождаться готовности Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 1
          done
          echo "Qdrant не поднялся за 30s" && exit 1

      - name: Integration tests (включая реальный Qdrant)
        run: uv run pytest tests/integration -v

      - name: E2E tests
        run: uv run pytest tests/e2e -v

  build-image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Сборка production-образа
        run: docker build -t dekoder:ci .
