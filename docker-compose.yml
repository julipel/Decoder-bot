services:
  api:
    build: .
    image: dekoder:latest
    command: ["uvicorn", "dekoder.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  telegram-bot:
    build: .
    image: dekoder:latest
    command: ["python", "-m", "dekoder.telegram_main"]
    env_file:
      - .env
    restart: unless-stopped
