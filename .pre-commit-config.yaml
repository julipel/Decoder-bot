repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Утверждённые документы (docs/) не переформатируются автоматически —
      # даже безобидная на вид правка (например, лишняя пустая строка в
      # конце файла) — это изменение архитектурного документа без ревью.
      - id: trailing-whitespace
        exclude: ^docs/
      - id: end-of-file-fixer
        exclude: ^docs/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic
          - pydantic-settings
        args: [--config-file=pyproject.toml]
        pass_filenames: false
        files: ^src/
