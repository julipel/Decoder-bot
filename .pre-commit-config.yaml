repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Утверждённые документы (docs/) не переформатируются автоматически —
      # даже безобидная на вид правка (например, лишняя пустая строка в
      # конце файла) — это изменение архитектурного документа без ревью.
      - id: trailing-whitespace
        exclude: ^docs/
      - id: end-of-file-fixer
        exclude: ^docs/
      # --unsafe: syntax-only check (не полное конструирование объектов) —
      # docker-compose.prod.yml (Sprint 11, S11-04) использует
      # Compose-специфичный merge-control тег `!reset` (docs.docker.com/
      # reference/compose-file/merge), не входящий в стандартный YAML;
      # обычный safe_load PyYAML не может его сконструировать и падает
      # false-positive `could not determine a constructor for the tag
      # '!reset'`, хотя файл синтаксически корректен и валиден для Compose.
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic
          - pydantic-settings
          - fastapi
          - python-telegram-bot
          - structlog
          - sqlalchemy[asyncio]
          - qdrant-client
          - python-docx
          - pypdf
        args: [--config-file=pyproject.toml]
        pass_filenames: false
        files: ^src/
